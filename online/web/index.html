<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14160f">
  <title>译口同声 UniVoice</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <header>
    <p class="brand">译口同声 UniVoice</p>
    <p id="status" class="status">准备</p>
  </header>

  <div class="direction">
    <button type="button" id="direction-toggle" class="direction-toggle" aria-expanded="false" aria-controls="direction-menu">
      <span id="direction-label">中英文互译</span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div id="direction-menu" class="menu" hidden>
      <button type="button" data-mode="auto" aria-checked="true">中英文互译</button>
      <button type="button" data-mode="en">中文 → 英文</button>
      <button type="button" data-mode="zh">英文 → 中文</button>
    </div>
  </div>

  <section id="panel-ready" class="panel">
    <h1>对着手机说话</h1>
    <p id="lead" class="lead">说中文就出英文，说英文就出中文。</p>
    <p id="ready-error" class="notice" hidden></p>
    <button type="button" id="start" class="primary">开始</button>
  </section>

  <section id="panel-listening" class="panel" hidden>
    <article class="live" aria-live="polite">
      <p id="live-source" class="source"></p>
      <p id="live-translation" class="translation"></p>
    </article>
    <ol id="history"></ol>
    <button type="button" id="stop" class="ghost">停止</button>
  </section>

  <section id="panel-mic" class="panel" hidden>
    <h1>需要麦克风</h1>
    <p class="lead">请在浏览器里允许使用麦克风，然后重试。</p>
    <button type="button" id="retry-mic" class="primary">再试一次</button>
  </section>

  <section id="panel-down" class="panel" hidden>
    <h1>连接中断</h1>
    <p class="lead">已经冻结的句子还在。重连后从新的一句开始。</p>
    <ol id="down-history"></ol>
    <button type="button" id="reconnect" class="primary">重新连接</button>
  </section>

  <script src="/app.js?v=5" type="module"></script>
</body>
</html>
