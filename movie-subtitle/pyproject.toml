[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-caption"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["soundcard", "numpy", "websockets>=12", "PySide6-Essentials"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["movie_caption*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
